# lxs.compose.yml
# Generated by lxs 0.1.0 from decoy.config.ts — do not edit by hand.
#
# Use:  docker compose -f docker-compose.yml -f lxs.compose.yml up -d
# Images are tagged for this SDK version. For production, pin digests by exporting
# LXS_AGENT_IMAGE / LXS_WEB_IMAGE / LXS_COWRIE_IMAGE as name:tag@sha256:<digest>.

x-ds-hardened: &ds-hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging: { driver: local, options: { max-size: "10m", max-file: "3" } }

services:
  shop:                                     # merged into the customer's own service
    volumes:
      - ds_web_sock:/run/lxs/web
      - ds_agent_sock:/run/lxs/agent
    environment:
      LXS_RUN_DIR: /run/lxs

  ds-agent:
    <<: *ds-hardened
    image: ${LXS_AGENT_IMAGE:-ghcr.io/lxs/agent:0.1.0}
    user: "10001:10001"
    env_file: [.env.lxs]            # the only place the key exists
    networks: [ds_uplink]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    volumes:
      - ds_agent_sock:/run/lxs/agent
      - ds_agent_state:/var/lib/lxs
      - ds_web_logs:/var/log/lxs/web:ro
      - ds_ssh_logs:/var/log/lxs/ssh-db-backup-01:ro
      - ds_redis_6380_logs:/var/log/lxs/redis-6380:ro
      - ds_postgres_5433_logs:/var/log/lxs/postgres-5433:ro
      - ./.lxs/manifest.json:/etc/lxs/manifest.json:ro
      - ./.lxs/secrets/honeytokens.json:/etc/lxs/honeytokens.json:ro

  ds-web:
    <<: *ds-hardened
    image: ${LXS_WEB_IMAGE:-ghcr.io/lxs/decoy-web:0.1.0}
    user: "10002:10002"
    network_mode: none                      # no network interface at all
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    tmpfs: ["/tmp:size=8m,noexec,nosuid"]
    volumes:
      - ds_web_sock:/run/lxs/web
      - ds_web_logs:/var/log/lxs
      - ./.lxs/web-decoys.json:/etc/lxs/web-decoys.json:ro
      - ./.lxs/secrets/honeytokens.json:/etc/lxs/honeytokens.json:ro

  ds-ssh-db-backup-01:
    <<: *ds-hardened
    image: ${LXS_COWRIE_IMAGE:-ghcr.io/lxs/cowrie-personas:0.1.0}
    networks: [ds_trap]
    ports: ["2222:2222"]                      # host port configured in decoy.config.ts
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    tmpfs: ["/tmp:size=16m,noexec,nosuid", "/cowrie/cowrie-git/var/run:size=1m"]
    volumes:
      - ds_ssh_logs:/cowrie/cowrie-git/var/log/cowrie
      - ds_ssh_data:/cowrie/cowrie-git/var/lib/cowrie
      - ./.lxs/ssh-db-backup-01/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - ./.lxs/secrets/ssh-db-backup-01/userdb.txt:/cowrie/cowrie-git/etc/userdb.txt:ro
      - ./.lxs/secrets/ssh-db-backup-01/honeyfs:/cowrie/honeyfs-live:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 2222), 2)"]
      interval: 30s
      timeout: 5s
      retries: 3

  ds-redis-6380:
    <<: *ds-hardened
    image: ${LXS_REDIS_IMAGE:-ghcr.io/lxs/decoy-redis:0.1.0}
    networks: [ds_trap]
    ports: ["6380:6379"]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    tmpfs: ["/tmp:size=8m,noexec,nosuid"]
    volumes:
      - ds_redis_6380_logs:/var/log/lxs:rw
    environment:
      LXS_DECOY_ID: "redis-6380"
      LXS_REDIS_SEED: "finance"
      LXS_REDIS_REQUIRE_PASSWORD: "0"

  ds-postgres-5433:
    <<: *ds-hardened
    image: ${LXS_POSTGRES_IMAGE:-ghcr.io/lxs/decoy-postgres:0.1.0}
    networks: [ds_trap]
    ports: ["5433:5432"]
    user: "70:70"
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_fake_only
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_DB: "shop_prod"
      PGDATA: /var/lib/postgresql/data
    command: ["postgres", "-c", "log_destination=jsonlog", "-c", "logging_collector=on", "-c", "log_directory=/var/log/lxs", "-c", "log_filename=postgres.log", "-c", "log_rotation_size=10MB", "-c", "log_connections=on", "-c", "log_disconnections=on", "-c", "log_min_messages=log", "-c", "max_connections=16", "-c", "shared_buffers=32MB", "-c", "work_mem=2MB", "-c", "temp_file_limit=16MB", "-c", "statement_timeout=10s"]
    tmpfs: ["/tmp:size=16m,noexec,nosuid", "/var/run/postgresql:size=1m,uid=70,gid=70,mode=0700", "/var/lib/postgresql/data:size=128m,uid=70,gid=70,mode=0700"]
    volumes:
      - ds_postgres_5433_logs:/var/log/lxs
      - ./.lxs/postgres-5433/init.sql:/docker-entrypoint-initdb.d/10-lxs-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lxs_fake -d shop_prod"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  ds_trap:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-ds-trap
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.enable_icc: "false"
    ipam:
      config: [{ subnet: 172.31.250.0/24 }]
  ds_uplink:
    driver: bridge

volumes:
  ds_web_sock: {}
  ds_agent_sock: {}
  ds_web_logs: {}
  ds_ssh_logs: {}
  ds_ssh_data: {}
  ds_redis_6380_logs: {}
  ds_postgres_5433_logs: {}
  ds_agent_state: {}
