# Default LXS Cowrie configuration (db-backup persona).
# `lxs build` generates a per-decoy cowrie.cfg with the same safety properties and mounts it over this one.

[honeypot]
hostname = db-backup-01
log_path = var/log/cowrie
state_path = var/lib/cowrie
download_path = ${honeypot:state_path}/downloads
etc_path = etc
# Operator override: files here replace the contents baked into the persona pickle (honeytokens, canary export).
contents_path = /cowrie/honeyfs-live
txtcmds_path = /cowrie/cowrie-git/share/cowrie/personas/db-backup/txtcmds
ttylog = true
backend = shell
auth_class = UserDB
download_limit_size = 10485760

[shell]
filesystem = /cowrie/cowrie-git/share/cowrie/personas/db-backup/fs.pickle
arch = linux-x64-lsb

[ssh]
enabled = true
version = SSH-2.0-OpenSSH_8.4p1 Debian-5+deb11u3
listen_endpoints = tcp:2222:interface=0.0.0.0
sftp_enabled = true
# Abuse prevention: the decoy can never be a proxy or tunnel endpoint (BREAKDOWN 7.12).
forwarding = false
forward_redirect = false
forward_tunnel = false

[telnet]
enabled = false

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false

[output_textlog]
enabled = false
